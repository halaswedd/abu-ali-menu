<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Abu Ali Shukair - Restaurant Menu"
    >

    <title>Abu Ali Shukair | Menu</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         MAIN MENU
    ========================================== -->

    <main class="menu-section" id="menu">


        <!-- =====================================
             LOGO
        ====================================== -->

        <div
            class="menu-logo-wrapper"
            id="menuLogo"
        >

            <img
                src="assets/Alogo1.png"
                alt="Abu Ali Shukair"
                class="menu-logo"
            >

        </div>



        <!-- =====================================
             MENU HEADER
        ====================================== -->

        <div class="section-heading">


            <span class="heading-line"></span>


            <p class="small-title">
                FRESH • GRILLED • DELICIOUS
            </p>


            <h1>
                OUR MENU
            </h1>


            <p class="section-subtitle">
                اختار من قائمتنا
            </p>

        </div>



        <!-- =====================================
             CATEGORIES
        ====================================== -->

        <div class="category-wrapper">

            <div
                class="category-filter"
                id="categoryFilter"
            >

                <button
                    class="category-btn active"
                    data-category="all"
                >
                    الكل
                </button>


                <button
                    class="category-btn"
                    data-category="sandwiches"
                >
                    سندويشات
                </button>


                <button
                    class="category-btn"
                    data-category="drinks"
                >
                    مشروبات
                </button>


                <button
                    class="category-btn"
                    data-category="grills"
                >
                    مشاوي
                </button>


                <button
                    class="category-btn"
                    data-category="chicken"
                >
                    فروج
                </button>
                 
                <button
                    class="category-btn"
                    data-category="meals"
                >
                    وجبات
                </button>

                <button
                    class="category-btn"
                    data-category="extras"
                >
                    إضافات
                </button>

            </div>

        </div>



        <!-- =====================================
             ITEMS GENERATED BY JAVASCRIPT
        ====================================== -->

        <div
            class="menu-list"
            id="menuList"
        ></div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

    <div class="footer-content">

        <!-- LEFT : LOGO -->
        <div class="footer-brand">

            <img
                src="assets/Alogo111.png"
                alt="Abu Ali Shukair"
                class="footer-logo"
            >

        </div>


        <!-- CENTER : LOCATION -->
        <div class="location-info">

            <a
                href="https://www.google.com/maps/search/?api=1&query=Al+Raya+Street+Beirut"
                target="_blank"
                rel="noopener"
            >
                📍 الضاحية جنوبية
                <br>
             ملعب الراية-شارع الصيني
            </a>

        </div>


        <!-- RIGHT : PHONE -->
       <div class="contact-info">

    <a
        href="https://wa.me/96181495264"
        target="_blank"
        rel="noopener"
    >
        81 495 264
    </a>
    <a
        href="https://wa.me/96170084606"
        target="_blank"
        rel="noopener"
    >
        70 084 606
    </a>

    </div>

    </div>


    <p class="copyright">
        © 2026 Abu Ali Shukair
    </p>

</footer>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
